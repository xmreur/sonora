[package]
name = "apple-music-core"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust core for custom Apple Music Linux client: auth, API, playback-engine abstraction (no Tauri/WebKit dependency so it builds anywhere)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
