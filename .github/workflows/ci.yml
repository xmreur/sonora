name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  linux:
    name: Linux (fmt, clippy, build, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libgl1-mesa-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build the app
        run: cargo build -p sonora --locked

      - name: Test
        run: cargo test --workspace --locked

  windows:
    name: Windows (build, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer
        shell: pwsh
        run: |
          $ver = "1.26.11"
          $root = "C:\gstreamer"
          $pkgs = @(
            "gstreamer-1.0-msvc-x86_64-$ver.msi",
            "gstreamer-1.0-devel-msvc-x86_64-$ver.msi"
          )
          foreach ($p in $pkgs) {
            $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc/$p"
            $dst = Join-Path $env:TEMP $p
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $dst
            Start-Process msiexec.exe -Wait -ArgumentList @(
              "/i", $dst, "/qn", "/norestart", "INSTALLDIR=$root"
            )
          }
          # The installer decides its own folder (Program Files since 1.26);
          # locate whichever one landed.
          $candidates = @(
            $root,
            (Join-Path $env:ProgramFiles "gstreamer"),
            (Join-Path ${env:ProgramFiles(x86)} "gstreamer")
          )
          $found = $candidates | Where-Object {
            $_ -and (Test-Path (Join-Path $_ "lib\pkgconfig\gstreamer-1.0.pc"))
          } | Select-Object -First 1
          if (-not $found) { throw "GStreamer install not found" }
          Write-Host "GStreamer at $found"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$found\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=$found\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  macos:
    name: macOS (build, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer
        run: brew install gstreamer pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked
