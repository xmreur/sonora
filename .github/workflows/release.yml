name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            runner: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux-bundles
          - id: windows
            runner: windows-latest
            bundles: msi,nsis
            artifact: windows-bundles
          - id: macos
            runner: macos-latest
            bundles: dmg,app
            artifact: macos-bundles
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Read app version
        id: version
        shell: bash
        run: echo "app_version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [ "$VERSION" != "${{ steps.version.outputs.app_version }}" ]; then
            echo "Tag version ($VERSION) does not match tauri.conf.json (${{ steps.version.outputs.app_version }})"
            exit 1
          fi

      - name: Build bundles (Linux)
        if: matrix.id == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --bundles deb,appimage

      - name: Strip host-GPU libs from AppImage (fix EGL_BAD_ALLOC on Wayland/Mesa 25+)
        if: matrix.id == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        shell: bash
        run: |
          chmod +x tools/fix-appimage-libs.sh
          ./tools/fix-appimage-libs.sh

      - name: Build bundles (Windows)
        if: matrix.id == 'windows'
        run: cargo tauri build --bundles msi,nsis

      - name: Build bundles (macOS)
        if: matrix.id == 'macos'
        run: cargo tauri build --bundles dmg,app

      - name: Zip macOS app bundle for release
        if: matrix.id == 'macos'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(target/release/bundle/macos/*.app)
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "No .app bundle under target/release/bundle/macos/"
            exit 1
          fi
          for app in "${apps[@]}"; do
            base="$(basename "$app" .app)"
            (cd target/release/bundle/macos && ditto -c -k --keepParent "$base.app" "$base.zip")
          done

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.zip
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Read app version
        id: version
        run: echo "app_version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Stage installer assets
        run: |
          mkdir -p staged
          find release-assets -type f \( \
            -name '*.deb' -o \
            -name '*.AppImage' -o \
            -name '*.msi' -o \
            -name '*-setup.exe' -o \
            -name '*.dmg' -o \
            -name '*.zip' \
          \) -exec cp -t staged {} +
          ls -la staged
          if [ -z "$(ls -A staged)" ]; then
            echo "No release installers found under release-assets/"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.app_version) }}
          name: Sonora v${{ steps.version.outputs.app_version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: staged/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
