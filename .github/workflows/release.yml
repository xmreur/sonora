name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35) on purpose: the AppImage and the deb
          # then run on 22.04+, Debian 12+, Fedora 36+ … a 24.04 build
          # would demand glibc 2.39 and cut out most current distros.
          - id: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-bundles
          - id: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-bundles
          - id: macos
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-bundles
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          # The ubuntu-22.04 image ships LLVM's libunwind-14-dev, which
          # conflicts with the libunwind-dev that jammy's
          # libgstreamer1.0-dev pulls in; apt then aborts with
          # "held broken packages". Drop LLVM's libunwind first
          # (actions/runner-images#9546). We never link against it.
          sudo apt-get remove -y 'libunwind-*' || true
          sudo apt-get install -y \
            pkg-config \
            binutils \
            curl \
            file \
            patchelf \
            desktop-file-utils \
            libasound2-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libgl1-mesa-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      - name: Install GStreamer (Windows)
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          $ver = "1.26.11"
          $pkgs = @(
            "gstreamer-1.0-msvc-x86_64-$ver.msi",
            "gstreamer-1.0-devel-msvc-x86_64-$ver.msi"
          )
          foreach ($p in $pkgs) {
            $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc/$p"
            $dst = Join-Path $env:TEMP $p
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $dst
            # 1.26 defaults to Program Files\gstreamer\1.0\msvc_x86_64.
            # INSTALLDIR is the leaf prefix; forcing C:\gstreamer hid the .pc file.
            $proc = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
              "/i", $dst, "/qn", "/norestart"
            )
            Write-Host "msiexec $p exit $($proc.ExitCode)"
            if ($proc.ExitCode -notin 0, 3010, 1641) {
              throw "msiexec $p failed with exit $($proc.ExitCode)"
            }
          }
          $roots = @(
            (Join-Path $env:ProgramFiles "gstreamer"),
            (Join-Path ${env:ProgramFiles(x86)} "gstreamer"),
            "C:\gstreamer"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $pc = $roots | ForEach-Object {
            Get-ChildItem -Path $_ -Filter "gstreamer-1.0.pc" -Recurse -File -ErrorAction SilentlyContinue
          } | Where-Object { $_.Directory.Name -eq "pkgconfig" } | Select-Object -First 1
          if (-not $pc) {
            Write-Host "Looked under: $($roots -join ', ')"
            throw "GStreamer install not found"
          }
          # ...\lib\pkgconfig\gstreamer-1.0.pc → the prefix that holds bin/ and lib/.
          $found = $pc.Directory.Parent.Parent.FullName
          Write-Host "GStreamer at $found"
          choco install pkgconfiglite -y --no-progress
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$found\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=$found\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install GStreamer (macOS)
        if: matrix.id == 'macos'
        run: brew install gstreamer pkg-config dylibbundler

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # crates/sonora/build.rs embeds the icon + version info via
      # winresource, which needs rc.exe from the MSVC environment.
      - name: Enable MSVC environment
        if: matrix.id == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Homebrew relinks gstreamer into a new Cellar dir between runs
      # (`Cellar/gstreamer/<version>_<revision>`). A restored cache replays
      # the previous -L path, so the link dies with
      # "library 'gstvideo-1.0' not found". Purge the pkg-config driven
      # GStreamer/GLib *-sys build output so their build scripts re-detect
      # what is installed on this runner.
      - name: Drop stale native-library link paths
        if: matrix.id == 'macos'
        run: |
          set -euo pipefail
          for sys in gstreamer gstreamer-base gstreamer-app gstreamer-video \
                     gstreamer-audio gstreamer-tag glib gobject gio; do
            rm -rf target/*/build/"${sys}-sys-"*
          done
          echo "GStreamer/GLib link paths will be re-detected"

      - name: Read app version
        id: version
        shell: bash
        run: echo "app_version=$(grep -m1 '^version' crates/sonora/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [ "$VERSION" != "${{ steps.version.outputs.app_version }}" ]; then
            echo "Tag version ($VERSION) does not match crates/sonora/Cargo.toml (${{ steps.version.outputs.app_version }})"
            exit 1
          fi

      # No `shell: bash` here: under Git Bash, rustc's linker search can
      # resolve `link` to Git's GNU coreutils link.exe (usr\bin\link.exe,
      # shipped since Git 2.56) instead of MSVC's link.exe, and the build
      # dies with "/usr/bin/link: extra operand". The default pwsh shell
      # keeps MSVC's link.exe first on PATH (as CI does).
      - name: Build release binary
        run: cargo build --release -p sonora --locked

      # Plain binary archives stay for power users on every platform; the
      # installable bundles below are built from the same binary.
      - name: Package portable archive (Linux, macOS)
        if: matrix.id != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.app_version }}"
          STAGE="sonora-$VER-${{ matrix.target }}"
          mkdir -p "$STAGE"
          if [ "${{ matrix.id }}" = "linux" ]; then
            strip "target/release/sonora"
          fi
          cp "target/release/sonora" "$STAGE/"
          cp packaging/sonora.desktop "$STAGE/"
          cp crates/sonora/icons/128x128.png "$STAGE/sonora.png"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          ls -la "$STAGE.tar.gz"

      # System GStreamer via apt dependencies — distro-correct and small.
      # The self-contained variant is the AppImage below.
      - name: Install cargo-deb
        if: matrix.id == 'linux'
        uses: taiki-e/install-action@cargo-deb
      - name: Build .deb
        if: matrix.id == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.app_version }}"
          cargo deb -p sonora --no-build
          mv target/debian/sonora_*_amd64.deb "Sonora-$VER-x86_64-linux.deb"
          ls -la "Sonora-$VER-x86_64-linux.deb"

      # Fully self-contained: bundles the GStreamer runtime + plugins and
      # runs on any x86_64 distro with glibc >= 2.35.
      - name: Build AppImage
        if: matrix.id == 'linux'
        shell: bash
        run: packaging/appimage/build-appimage.sh "${{ steps.version.outputs.app_version }}"

      - name: Package (Windows)
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.app_version }}"
          $stage = "sonora-$ver-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage, "$stage\plugins" | Out-Null
          Copy-Item target/release/sonora.exe $stage/
          # The full MSVC runtime: all of gst's bin\ DLLs sit next to
          # sonora.exe (the loader searches the application dir), the
          # plugin objects go into plugins\ and are picked up at startup
          # via GST_PLUGIN_SYSTEM_PATH_1_0 (crates/sonora/src/gst_bundle.rs).
          $gst = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          Copy-Item "$gst\bin\*.dll" $stage/
          Copy-Item "$gst\lib\gstreamer-1.0\*.dll" "$stage\plugins\"
          Compress-Archive -Path $stage -DestinationPath "Sonora-$ver-windows-x86_64-portable.zip" -Force
          Get-ChildItem "Sonora-$ver-windows-x86_64-portable.zip"

      - name: Build NSIS installer
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.app_version }}"
          choco install nsis -y --no-progress
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis" }
          # Payload files must be the cwd: sonora.nsi references them
          # relative to where makensis runs.
          Push-Location "sonora-$ver-windows-x86_64"
          & $makensis "/DVERSION=$ver" "/DINSTALLER_ICON=$env:GITHUB_WORKSPACE\crates\sonora\icons\icon.ico" "..\packaging\windows\sonora.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit $LASTEXITCODE" }
          Pop-Location
          Move-Item "sonora-$ver-windows-x86_64\Sonora-Setup-$ver.exe" "Sonora-Setup-$ver.exe"
          Get-ChildItem "Sonora-Setup-$ver.exe"

      # Untested on real hardware: bundles the Homebrew GStreamer dylibs
      # into Sonora.app and wraps it in a DMG + zip.
      - name: Package .app + DMG (macOS)
        if: matrix.id == 'macos'
        shell: bash
        run: packaging/macos/build-app.sh "${{ steps.version.outputs.app_version }}" target/release/sonora

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.zip
            *.AppImage
            *.deb
            *.exe
            *.dmg
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Read app version
        id: version
        run: echo "app_version=$(grep -m1 '^version' crates/sonora/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Stage assets
        run: |
          mkdir -p staged
          find release-assets -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp -t staged {} +
          ls -la staged
          if [ -z "$(ls -A staged)" ]; then
            echo "No release assets found under release-assets/"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.app_version) }}
          name: Sonora v${{ steps.version.outputs.app_version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: staged/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
