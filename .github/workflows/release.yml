name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Read app version
        id: version
        run: echo "app_version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [ "$VERSION" != "${{ steps.version.outputs.app_version }}" ]; then
            echo "Tag version ($VERSION) does not match tauri.conf.json (${{ steps.version.outputs.app_version }})"
            exit 1
          fi

      - name: Build Linux bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --bundles deb,appimage

      - name: Strip host-GPU libs from AppImage (fix EGL_BAD_ALLOC on Wayland/Mesa 25+)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x tools/fix-appimage-libs.sh
          ./tools/fix-appimage-libs.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.app_version) }}
          name: Sonora v${{ steps.version.outputs.app_version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
