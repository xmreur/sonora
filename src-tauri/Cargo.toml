[package]
name = "apple-music-linux-client"
version = "0.1.0"
edition = "2021"
default-run = "apple-music-linux-client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
apple-music-core = { path = "../crates/core" }
shell = { path = "../crates/shell", package = "sonora-shell" }

[features]
