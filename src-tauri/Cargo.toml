[package]
name = "apple-music-linux-client"
version = "0.1.0"
edition = "2021"
default-run = "apple-music-linux-client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
apple-music-core = { path = "../crates/core" }
discord-rich-presence = "1"

[features]
default = []
# Enables real OS media integration; off by default so `cargo check` works
# on minimal machines. Turn on with --features mpris.
mpris = []
