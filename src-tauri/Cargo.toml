[package]
name = "apple-music-linux-client"
version = "0.1.0"
edition = "2021"
default-run = "apple-music-linux-client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify-rust = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
apple-music-core = { path = "../crates/core" }
am-playback = { path = "../crates/am-playback" }
discord-rich-presence = "1"
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
souvlaki = "0.8"

[features]
