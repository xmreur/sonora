# Flatpak manifest for Sonora.
#
# Crates are vendored by flatpak-cargo-generator; regenerate the source
# list whenever Cargo.lock changes (see README → Packaging):
#   flatpak-cargo-generator.py Cargo.lock -o packaging/cargo-sources.json
app-id: com.xmreur.sonora
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.gnome.Sdk.Extension.rust-stable
command: sonora
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --own-name=org.mpris.MediaPlayer2.sonora
  - --filesystem=xdg-run/discord-ipc-0
modules:
  - name: sonora
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/sonora/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked -p sonora
      - install -Dm755 target/release/sonora /app/bin/sonora
      - install -Dm644 packaging/sonora.desktop /app/share/applications/sonora.desktop
      - install -Dm644 crates/sonora/icons/icon.png /app/share/icons/hicolor/512x512/apps/sonora.png
      - install -Dm644 crates/sonora/icons/128x128.png /app/share/icons/hicolor/128x128/apps/sonora.png
      - install -Dm644 crates/sonora/icons/64x64.png /app/share/icons/hicolor/64x64/apps/sonora.png
      - install -Dm644 crates/sonora/icons/32x32.png /app/share/icons/hicolor/32x32/apps/sonora.png
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
